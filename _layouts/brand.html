<!doctype html>
<html lang="fr">
  {% include head.html %}
  <body>
    {% include nav.html %}

    {% assign brand = site.data.brands | where: "slug", page.brand | first %}
    {% assign brand_include = "brands/" | append: brand.slug | append: ".html" %}
    <main class="brand brand--{{ brand.slug }}">
      <div class="brand-back">
        <a href="/creations/">&larr;&nbsp;Tous les projets</a>
      </div>
      {% include {{ brand_include }} %}
    </main>

    {% include footer.html %}
  </body>
</html>
